<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório de Física: Simulador de Lançamento de Projéteis</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #f43f5e;
            --success: #10b981;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .sim-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            background: #090d16;
            border: 2px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: linear-gradient(to bottom, #020617, #0f172a);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .metric-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .metric-card .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .metric-card .value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
        }

        .control-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .control-group label span {
            color: var(--accent);
            font-weight: 700;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            outline: none;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--accent);
            color: #020617;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-color);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .btn-danger {
            background-color: rgba(244, 63, 94, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .btn-danger:hover {
            background-color: rgba(244, 63, 94, 0.2);
        }

        .challenge-banner {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
        }

        .challenge-banner.active {
            display: block;
        }

        /* Modal / Tabela de Dados */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            color: var(--accent);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: auto;
        }

        .close-btn:hover {
            color: var(--text-color);
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            max-height: 60vh;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th,
        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            background: rgba(255, 255, 255, 0.02);
        }

        td {
            color: var(--text-color);
        }

        .empty-table {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Laboratório de Cinemática</h1>
        <p>Simulador de Lançamento de Projéteis | $g = 9,8\text{ m/s}^2$</p>
    </header>

    <div class="main-container">
        <!-- Área de Simulação e Métricas -->
        <div class="sim-area">
            <div class="canvas-wrapper">
                <canvas id="simCanvas" width="800" height="450"></canvas>
            </div>
            <div class="dashboard">
                <div class="metric-card">
                    <div class="label">Alcance</div>
                    <div class="value" id="valRange">0,00 m</div>
                </div>
                <div class="metric-card">
                    <div class="label">Altura Máxima</div>
                    <div class="value" id="valHeight">0,00 m</div>
                </div>
                <div class="metric-card">
                    <div class="label">Tempo de Voo</div>
                    <div class="value" id="valTime">0,00 s</div>
                </div>
            </div>
        </div>

        <!-- Painel de Controles -->
        <div class="control-panel">
            <div class="challenge-banner" id="challengeBanner">
                <strong>Modo Desafio Ativo</strong><br>
                Alvo atual: <span id="targetDistance">0</span> m<br>
                Tentativas: <span id="targetAttempts">0</span>
            </div>

            <div class="control-group">
                <label for="angleRange">Ângulo de Lançamento: <span id="angleVal">45</span>°</label>
                <input type="range" id="angleRange" min="0" max="90" value="45" step="1">
            </div>

            <div class="control-group">
                <label for="velocityRange">Velocidade Inicial: <span id="velocityVal">25</span> m/s</label>
                <input type="range" id="velocityRange" min="5" max="50" value="25" step="1">
            </div>

            <div class="btn-container">
                <button class="btn-primary" id="launchBtn">Lançar Projétil</button>
                <button class="btn-secondary" id="challengeBtn">Ativar Modo Desafio</button>
                <button class="btn-secondary" id="dataBtn">Mostrar Dados</button>
                <button class="btn-danger" id="clearBtn">Limpar Rastros</button>
            </div>
        </div>
    </div>

    <!-- Modal de Tabela de Dados -->
    <div class="modal" id="dataModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Registro de Lançamentos</h3>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Ângulo (°)</th>
                            <th>Velocidade (m/s)</th>
                            <th>Alcance (m)</th>
                            <th>Alt. Máx (m)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Inserido via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Controles da UI
        const angleRange = document.getElementById('angleRange');
        const velocityRange = document.getElementById('velocityRange');
        const angleVal = document.getElementById('angleVal');
        const velocityVal = document.getElementById('velocityVal');
        const launchBtn = document.getElementById('launchBtn');
        const clearBtn = document.getElementById('clearBtn');
        const dataBtn = document.getElementById('dataBtn');
        const challengeBtn = document.getElementById('challengeBtn');
        const challengeBanner = document.getElementById('challengeBanner');
        const targetDistanceSpan = document.getElementById('targetDistance');
        const targetAttemptsSpan = document.getElementById('targetAttempts');

        const valRange = document.getElementById('valRange');
        const valHeight = document.getElementById('valHeight');
        const valTime = document.getElementById('valTime');

        const dataModal = document.getElementById('dataModal');
        const closeModal = document.getElementById('closeModal');
        const tableBody = document.getElementById('tableBody');

        // Parâmetros físicos e de escala
        const g = 9.8;
        const scaleX = 8; // pixels por metro (800px / 100m)
        const scaleY = 8;
        const originX = 50; // Posição X do canhão em pixels
        const originY = 400; // Posição Y do canhão (chão)

        let traces = []; // Histórico de trajetórias
        let historyData = []; // Dados para a tabela
        let isAnimating = false;
        let animationFrameId = null;

        // Modo Desafio
        let challengeActive = false;
        let targets = [25, 45, 65, 80, 95];
        let currentTargetIdx = 0;
        let targetAttempts = 0;

        // Cores para diferentes rastros
        const traceColors = ['#38bdf8', '#f43f5e', '#10b981', '#fbbf24', '#a855f7', '#ec4899', '#6366f1'];

        // Atualizar valores na UI ao mover os sliders
        angleRange.addEventListener('input', () => {
            angleVal.textContent = angleRange.value;
            drawScene();
        });

        velocityRange.addEventListener('input', () => {
            velocityVal.textContent = velocityRange.value;
            drawScene();
        });

        // Conversão de coordenadas físicas (metros) para tela (pixels)
        function toPixelX(meters) {
            return originX + (meters * scaleX);
        }

        function toPixelY(meters) {
            return originY - (meters * scaleY);
        }

        // Desenhar fundo, grades e escala
        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Linha do chão
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, originY);
            ctx.lineTo(canvas.width, originY);
            ctx.stroke();

            // Marcações de distância no chão (a cada 10 metros)
            ctx.fillStyle = '#94a3b8';
            ctx.font = '11px system-ui';
            ctx.textAlign = 'center';

            for (let m = 0; m <= 100; m += 10) {
                let px = toPixelX(m);
                if (px < canvas.width - 20) {
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(px, 0);
                    ctx.lineTo(px, originY);
                    ctx.stroke();

                    // Traço menor na régua
                    ctx.strokeStyle = '#94a3b8';
                    ctx.beginPath();
                    ctx.moveTo(px, originY);
                    ctx.lineTo(px, originY + 5);
                    ctx.stroke();

                    if (m > 0) {
                        ctx.fillText(`${m}m`, px, originY + 18);
                    }
                }
            }
        }

        // Desenhar o canhão
        function drawCannon(angleDeg) {
            let px = originX;
            let py = originY;
            let angleRad = angleDeg * (Math.PI / 180);

            ctx.save();
            ctx.translate(px, py);
            ctx.rotate(-angleRad);

            // Cano do canhão
            ctx.fillStyle = '#64748b';
            ctx.fillRect(0, -8, 35, 16);
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1;
            ctx.strokeRect(0, -8, 35, 16);

            ctx.restore();

            // Base do canhão (roda)
            ctx.beginPath();
            ctx.arc(px, py, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#475569';
            ctx.fill();
            ctx.strokeStyle = '#94a3b8';
            ctx.stroke();
        }

        // Desenhar alvo do modo desafio
        function drawTarget() {
            if (!challengeActive) return;

            let dist = targets[currentTargetIdx];
            let tx = toPixelX(dist);
            let ty = originY;

            ctx.save();
            ctx.translate(tx, ty);

            // Base do alvo
            ctx.fillStyle = '#f43f5e';
            ctx.fillRect(-4, -30, 8, 30);

            // Círculo do alvo
            ctx.beginPath();
            ctx.arc(0, -35, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#f43f5e';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, -35, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.restore();
        }

        // Desenhar todos os rastros salvos
        function drawTraces() {
            traces.forEach((trace) => {
                ctx.strokeStyle = trace.color;
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                trace.points.forEach((p, idx) => {
                    let screenX = toPixelX(p.x);
                    let screenY = toPixelY(p.y);
                    if (idx === 0) ctx.moveTo(screenX, screenY);
                    else ctx.lineTo(screenX, screenY);
                });
                ctx.stroke();
                ctx.setLineDash([]); // Resetar tracejado
            });
        }

        // Renderizar toda a cena estática
        function drawScene() {
            drawGrid();
            drawTarget();
            drawTraces();
            drawCannon(parseFloat(angleRange.value));
        }

        // Animação do Lançamento
        function launchProjectile() {
            if (isAnimating) return;

            let angleDeg = parseFloat(angleRange.value);
            let v0 = parseFloat(velocityRange.value);
            let angleRad = angleDeg * (Math.PI / 180);

            let v0x = v0 * Math.cos(angleRad);
            let v0y = v0 * Math.sin(angleRad);

            // Fórmulas físicas exatas
            let tFlight = (2 * v0y) / g;
            let range = v0x * tFlight;
            let maxHeight = (v0y * v0y) / (2 * g);

            // Gerar pontos da trajetória para animação suave
            let points = [];
            let steps = 100;
            for (let i = 0; i <= steps; i++) {
                let t = (i / steps) * tFlight;
                let x = v0x * t;
                let y = (v0y * t) - (0.5 * g * t * t);
                if (y < 0) y = 0;
                points.push({ x, y, t });
            }

            let color = traceColors[historyData.length % traceColors.length];
            let currentTrace = { points: [], color: color };
            traces.push(currentTrace);

            isAnimating = true;
            let startTime = performance.now();
            let duration = tFlight * 1000; // converter para ms (em tempo real)
            // Para garantir fluidez, podemos acelerar ou desacelerar se necessário, mas 1:1 é excelente para física.
            // Ajuste opcional: se tFlight for muito grande, limitamos a duração visual máxima para 3 segundos.
            let visualDuration = Math.min(Math.max(duration, 1000), 3000);

            function animate(now) {
                let elapsed = now - startTime;
                let progress = Math.min(elapsed / visualDuration, 1);
                let currentIdx = Math.floor(progress * steps);

                currentTrace.points = points.slice(0, currentIdx + 1);

                drawScene();

                // Desenhar projétil em movimento
                if (currentIdx < points.length) {
                    let p = points[currentIdx];
                    let px = toPixelX(p.x);
                    let py = toPixelY(p.y);

                    ctx.beginPath();
                    ctx.arc(px, py, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                if (progress < 1) {
                    animationFrameId = requestAnimationFrame(animate);
                } else {
                    isAnimating = false;
                    currentTrace.points = points; // Garantir trajetória completa
                    drawScene();

                    // Atualizar placar de métricas
                    valRange.textContent = range.toFixed(2) + " m";
                    valHeight.textContent = maxHeight.toFixed(2) + " m";
                    valTime.textContent = tFlight.toFixed(2) + " s";

                    // Registrar dados
                    historyData.push({
                        id: historyData.length + 1,
                        angle: angleDeg,
                        velocity: v0,
                        range: range.toFixed(2),
                        height: maxHeight.toFixed(2)
                    });
                    updateTable();

                    // Checar Modo Desafio
                    if (challengeActive) {
                        targetAttempts++;
                        targetAttemptsSpan.textContent = targetAttempts;
                        let targetDist = targets[currentTargetIdx];
                        // Tolerância de acerto de 1 metro
                        if (Math.abs(range - targetDist) <= 1.5) {
                            alert(`Parabéns! Você atingiu o alvo de ${targetDist}m em ${targetAttempts} tentativa(s)!`);
                            currentTargetIdx++;
                            targetAttempts = 0;
                            if (currentTargetIdx >= targets.length) {
                                alert("Incrível! Você concluiu todos os desafios do laboratório!");
                                toggleChallenge();
                            } else {
                                targetDistanceSpan.textContent = targets[currentTargetIdx];
                                targetAttemptsSpan.textContent = targetAttempts;
                            }
                        }
                    }
                }
            }

            animationFrameId = requestAnimationFrame(animate);
        }

        // Atualizar tabela de dados no modal
        function updateTable() {
            if (historyData.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="empty-table">Nenhum lançamento realizado ainda.</td></tr>`;
                return;
            }

            tableBody.innerHTML = historyData.map(item => `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.angle}°</td>
                    <td>${item.velocity} m/s</td>
                    <td>${item.range} m</td>
                    <td>${item.height} m</td>
                </tr>
            `).join('');
        }

        // Alternar Modo Desafio
        function toggleChallenge() {
            challengeActive = !challengeActive;
            if (challengeActive) {
                challengeBanner.classList.add('active');
                challengeBtn.textContent = "Desativar Modo Desafio";
                currentTargetIdx = 0;
                targetAttempts = 0;
                targetDistanceSpan.textContent = targets[currentTargetIdx];
                targetAttemptsSpan.textContent = targetAttempts;
            } else {
                challengeBanner.classList.remove('active');
                challengeBtn.textContent = "Ativar Modo Desafio";
            }
            drawScene();
        }

        // Event Listeners
        launchBtn.addEventListener('click', launchProjectile);

        clearBtn.addEventListener('click', () => {
            if (isAnimating) cancelAnimationFrame(animationFrameId);
            isAnimating = false;
            traces = [];
            historyData = [];
            valRange.textContent = "0,00 m";
            valHeight.textContent = "0,00 m";
            valTime.textContent = "0,00 s";
            updateTable();
            drawScene();
        });

        dataBtn.addEventListener('click', () => {
            dataModal.classList.add('active');
        });

        closeModal.addEventListener('click', () => {
            dataModal.classList.remove('active');
        });

        window.addEventListener('click', (e) => {
            if (e.target === dataModal) {
                dataModal.classList.remove('active');
            }
        });

        challengeBtn.addEventListener('click', toggleChallenge);

        // Inicialização
        updateTable();
        drawScene();
    </script>
</body>

</html>
